name: CI / Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore TPVC.sln

      - name: Build Solution
        run: dotnet build TPVC.sln --configuration Release --no-restore

      - name: Execute Unit Tests
        run: dotnet test TPVC.sln --configuration Release --no-build --verbosity normal

      - name: Build Installer and Packages
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Version "1.3.3"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPVC-Setup-v1.3.3
          path: ./publish/TPVC-Setup-v1.3.3.exe

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPVC-v1.3.3-win-x64
          path: ./publish/TPVC-v1.3.3-win-x64.zip
