name: CI / Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version from TPVC.csproj
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content TPVC.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore Dependencies
        run: dotnet restore TPVC.sln

      - name: Build Solution
        run: dotnet build TPVC.sln --configuration Release --no-restore

      - name: Execute Unit Tests
        run: dotnet test TPVC.sln --configuration Release --no-build --verbosity normal

      # Las fechas se guardan en hora local del consultorio: repetir las pruebas en la zona de México
      # detecta desfases que no aparecen con el reloj del runner en UTC
      - name: Execute Unit Tests (zona horaria de México)
        shell: pwsh
        run: |
          tzutil /s "Central Standard Time (Mexico)"
          dotnet test TPVC.sln --configuration Release --no-build --verbosity minimal

      - name: Build Installer and Packages
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPVC-Setup-v${{ steps.version.outputs.value }}
          path: ./publish/TPVC-Setup-v${{ steps.version.outputs.value }}.exe

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPVC-v${{ steps.version.outputs.value }}-win-x64
          path: ./publish/TPVC-v${{ steps.version.outputs.value }}-win-x64.zip
